server:
  port: 8081

spring:
  application:
    name: ms-andesstay-reservations
  datasource:
    url: jdbc:h2:mem:reservationsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
